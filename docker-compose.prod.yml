# Digital Campus LAN/VPS deployment
# Usage:
#   make env-provision         # first run: generate secrets into .env files
#   docker-compose -f docker-compose.prod.yml build
#   docker-compose -f docker-compose.prod.yml up -d db redis minio minio-init backend worker frontend backup-scheduler
#   docker-compose -f docker-compose.prod.yml run --rm backend python -m alembic upgrade head
#
# Hardening notes:
#   - db/redis/minio expose NO host ports in production — they are only
#     reachable on the internal compose network.
#   - MinIO root credentials come from the project .env (generated by
#     make env-provision); the backend talks to MinIO with a scoped
#     application user that can only touch the kudos bucket.
#   - Backups sail into the same MinIO server every night (see
#     backup-scheduler).
# compose v2


services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_campus}
      POSTGRES_USER: ${POSTGRES_USER:-dc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via make env-provision}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./services/backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER via make env-provision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD via make env-provision}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./deploy/minio/init.sh:/init.sh:ro
      - ./deploy/minio/app-policy.json:/policies/app-policy.json:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER via make env-provision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD via make env-provision}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY via make env-provision}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY via make env-provision}
      MINIO_BUCKET: ${MINIO_BUCKET:-kudos}
    depends_on:
      - minio
    restart: "no"

  backend:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AUTO_CREATE_TABLES: "false"
      MCP_ENABLED: "true"
      MCP_URL: http://mcp:8765/mcp
      MCP_REQUIRE_AUTH: "true"
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dc_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via make env-provision}@db:5432/${POSTGRES_DB:-digital_campus}
      # KUDOS self-learning via opencode subagents (sidecar service below)
      OPENCODE_AGENT_URL: http://opencode-agent:8090
      LEARN_WITH_AGENTS: "true"
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      # KUDOS Voice — local cloning via the Coqui sidecar (no API key needed).
      COQUI_TTS_URL: http://coqui-tts:8082
      VOICE_CLONE_PROVIDER: ${VOICE_CLONE_PROVIDER:-elevenlabs}
      VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-}
      # Fish Audio — fast cloud TTS + voice cloning.
      FISH_API_KEY: ${FISH_API_KEY:-}
      FISH_TTS_MODEL: ${FISH_TTS_MODEL:-s2.1-pro-free}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kudos_state:/app/kudos_state
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
      - redis
      - minio
      - minio-init
      - mcp
      - opencode-agent
    restart: unless-stopped

  mcp:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    environment:
      MCP_ENABLED: "true"
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      MCP_REQUIRE_AUTH: "true"
      MCP_ALLOW_MUTATIONS: "false"
      MCP_URL: http://mcp:8765/mcp
      DATABASE_URL: postgresql://${POSTGRES_USER:-dc_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via make env-provision}@db:5432/${POSTGRES_DB:-digital_campus}
    expose:
      - "8765"
    command: python -m app.mcp_server
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dc_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via make env-provision}@db:5432/${POSTGRES_DB:-digital_campus}
    command: celery -A app.celery_app.celery worker --loglevel=info
    depends_on:
      - backend
      - redis
      - minio
    restart: unless-stopped

  # KUDOS self-learning sidecar: runs `opencode run` on behalf of the backend.
  # The host opencode credentials are mounted read-only so the subagents use
  # the campus account's providers.
  opencode-agent:
    build: ./services/opencode-agent
    environment:
      PORT: 8090
      DEFAULT_AGENT: build
      MAX_CONCURRENT: "2"
      RUN_TIMEOUT_MS: "480000"
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
    volumes:
      - ${OPENCODE_AUTH_FILE:-${HOME}/.local/share/opencode/auth.json}:/home/opencode/.local/share/opencode/auth.json:ro
    expose:
      - "8090"
    restart: unless-stopped

  # KUDOS local voice cloning — Coqui XTTS v2 (no API key). The model cache
  # lives on a volume so restarts skip the ~1.8GB download.
  coqui-tts:
    build: ./services/coqui-tts
    environment:
      VOICES_DIR: /data/voices
      XTTS_LANGUAGE: ${COQUI_TTS_LANGUAGE:-en}
    volumes:
      - coqui_data:/models
      - coqui_voices:/data/voices
    expose:
      - "8082"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Daily pg_dump -> MinIO (backups/ prefix), pruned to BACKUP_KEEP (14).
  backup-scheduler:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    command: ["python", "-m", "app.core.backup_scheduler"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dc_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via make env-provision}@db:5432/${POSTGRES_DB:-digital_campus}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY via make env-provision}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY via make env-provision}
      MINIO_BUCKET: ${MINIO_BUCKET:-kudos}
      MINIO_SECURE: "false"
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - backup_data:/backups
    depends_on:
      - db
      - minio
    restart: unless-stopped

# Public entry point — single URL users share (default http://<server-ip>).
  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Instant public HTTPS URL through NAT — `tunnel --url` quick tunnel the
  # hostname printed in the logs (random subdomain, changes on restart).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://frontend:3000 --protocol http2 --no-autoupdate
    depends_on:
      - frontend
    restart: unless-stopped

  # Permanent public HTTPS URL — Tailscale Funnel (free personal plan).
  # URL: https://<tailscale-hostname>.<tailnet-name>.ts.net  (stable)
  tailscale:
    image: tailscale/tailscale:latest
    hostname: digital-campus
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./deploy/tailscale/boot.sh:/boot.sh:ro
    entrypoint: ["/bin/sh", "/boot.sh"]
    environment:
      TS_AUTH_TOKEN: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env (tailscale auth key)}
      TS_ACCEPT_DNS: "false"
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  minio_data:
  backup_data:
  caddy_data:
  caddy_config:
  tailscale_state:
  kudos_state:
  coqui_data:
  coqui_voices: