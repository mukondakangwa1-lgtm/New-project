# Digital Campus LAN/VPS deployment
# Usage:
#   docker-compose -f docker-compose.prod.yml build
#   docker-compose -f docker-compose.prod.yml up -d db redis backend worker frontend
#   docker-compose -f docker-compose.prod.yml run --rm backend python -m alembic upgrade head
version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_campus}
      POSTGRES_USER: ${POSTGRES_USER:-dc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./services/backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AUTO_CREATE_TABLES: "false"
      MCP_ENABLED: "true"
      MCP_URL: http://mcp:8765/mcp
      MCP_REQUIRE_AUTH: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-dc_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@db:5432/${POSTGRES_DB:-digital_campus}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
      - redis
      - mcp
    restart: unless-stopped

  mcp:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    environment:
      MCP_ENABLED: "true"
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      MCP_REQUIRE_AUTH: "true"
      MCP_ALLOW_MUTATIONS: "false"
      MCP_URL: http://mcp:8765/mcp
      DATABASE_URL: postgresql://${POSTGRES_USER:-dc_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@db:5432/${POSTGRES_DB:-digital_campus}
    expose:
      - "8765"
    command: python -m app.mcp_server
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql://${POSTGRES_USER:-dc_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@db:5432/${POSTGRES_DB:-digital_campus}
    command: celery -A app.celery_app.celery worker --loglevel=info
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
