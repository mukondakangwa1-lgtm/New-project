name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: ruff check app/ tests/ --select F

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  migration:
    name: Migration (alembic upgrade)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations on a fresh SQLite DB
        run: |
          DATABASE_URL="sqlite:///./ci_migrate.db" alembic upgrade head
          DATABASE_URL="sqlite:///./ci_migrate.db" python -c "
          from sqlalchemy import create_engine, inspect
          insp = inspect(create_engine('sqlite:///./ci_migrate.db'))
          tables = set(insp.get_table_names())
          required = {
            'users', 'courses', 'enrollments', 'chat_rooms', 'chat_messages',
            'kudos_documents', 'kudos_connectors', 'speaking_sessions',
            'broadcasts', 'video_calls', 'whiteboard_strokes', 'journal_blocks',
          }
          missing = required - tables
          assert not missing, f'Missing tables: {missing}'
          print(f'Migrations OK — {len(tables)} tables')
          "
