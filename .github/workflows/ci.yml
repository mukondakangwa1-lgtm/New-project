name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: ruff check app/ tests/ --select F

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  migration:
    name: Migration (alembic upgrade)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations on a fresh SQLite DB
        run: |
          DATABASE_URL="sqlite:///./ci_migrate.db" alembic upgrade head
          DATABASE_URL="sqlite:///./ci_migrate.db" python -c "
          from sqlalchemy import create_engine, inspect
          insp = inspect(create_engine('sqlite:///./ci_migrate.db'))
          tables = set(insp.get_table_names())
          required = {
            'users', 'courses', 'enrollments', 'chat_rooms', 'chat_messages',
            'kudos_documents', 'kudos_connectors', 'speaking_sessions',
            'broadcasts', 'video_calls', 'whiteboard_strokes', 'journal_blocks',
            'kudos_sandbox_proposals', 'kudos_sandbox_logs', 'kudos_agent_tasks',
          }
          missing = required - tables
          assert not missing, f'Missing tables: {missing}'
          print(f'Migrations OK — {len(tables)} tables')
          "

  e2e:
    name: E2E (docker stack + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Boot the E2E stack
        run: |
          docker compose -f e2e/docker-compose.e2e.yml up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8100/api/v1/health >/dev/null && \
              curl -sf http://localhost:3100/login >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8100/api/v1/health >/dev/null
          curl -sf http://localhost:3100/login >/dev/null

      - name: Run agent flow tests
        working-directory: e2e
        run: E2E_BASE_URL=http://localhost:3100 npx playwright test

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.e2e.yml logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v
