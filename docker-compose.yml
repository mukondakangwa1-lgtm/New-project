# =============================================
# Digital Campus - Docker Compose (enhanced)
# Adds Postgres (with pgvector), Redis, and a Celery worker
# =============================================
version: "3.9"

services:
  backend:
    build: ./services/backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./services/backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AUTO_CREATE_TABLES=true
    volumes:
      - ./services/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_DB=digital_campus
      - POSTGRES_USER=dc_user
      - POSTGRES_PASSWORD=dc_pass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./services/backend/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    volumes:
      - ./services/backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.celery_app.celery worker --loglevel=info

volumes:
  db_data:
