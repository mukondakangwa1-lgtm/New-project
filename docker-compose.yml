# =============================================
# Digital Campus - Docker Compose (development)
# Postgres (pgvector), Redis, Celery worker and MinIO object storage.
#
#   make env-provision   # generate secrets once (idempotent)
#   docker compose up -d --build
# =============================================

services:
  backend:
    build: ./services/backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./services/backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AUTO_CREATE_TABLES=true
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./services/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis
      - minio

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-digital_campus}
      - POSTGRES_USER=${POSTGRES_USER:-dc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Run `make env-provision` first}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./services/backend/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER via make env-provision}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD via make env-provision}
      - MINIO_BROWSER=on
    ports:
      - "127.0.0.1:9000:9000"   # S3 API — loopback only
      - "127.0.0.1:9001:9001"   # Console — loopback only
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./deploy/minio/init.sh:/init.sh:ro
      - ./deploy/minio/app-policy.json:/policies/app-policy.json:ro
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER via make env-provision}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD via make env-provision}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY via make env-provision}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY via make env-provision}
      - MINIO_BUCKET=${MINIO_BUCKET:-kudos}
    depends_on:
      - minio
    restart: "no"

  worker:
    build: ./services/backend
    env_file:
      - ./services/backend/.env
    environment:
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./services/backend:/app
    depends_on:
      - backend
      - redis
      - minio
    command: celery -A app.celery_app.celery worker --loglevel=info

volumes:
  db_data:
  minio_data: