# =============================================
# Digital Campus Backend - Docker Compose
# =============================================
version: "3.9"

services:
  backend:
    build: ./services/backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_SECRET_KEY=changeme-in-docker
      - BACKEND_DEBUG=true
    volumes:
      - ./services/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
